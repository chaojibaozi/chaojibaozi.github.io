<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>360搜索推广效果评估分析系统</title>
<style>
/* ============================================================
   设计系统 · 360 品牌绿 · 浅色 / 深色双主题
   设计原则：统一 token、4px 间距基准、语义色、可达性(对比度≥4.5:1)
   ============================================================ */
:root{
  /* —— 主色：360 品牌绿 —— */
  --p:#0A7C45; --p-hover:#09723F; --p-active:#086536;
  --p-50:#E8F8F0; --p-100:#CDEFDD; --p-700:#0A7C45; --p-ink:#075C33;
  /* —— AI 强调色（区分于品牌绿） —— */
  --ai:#6D4AFF; --ai-hover:#5B34F0; --ai-50:#F1ECFF; --ai-700:#4B2FD6;
  /* —— 语义色 —— */
  --ok:#0F7A39; --ok-bg:#E7F6EC; --ok-bd:#BFE6CB;
  --warn:#9A5B00; --warn-bg:#FDF3E3; --warn-bd:#F6DFB0;
  --danger:#C53035; --danger-bg:#FDECEC; --danger-bd:#F7C9C9;
  --info:#1E63D6; --info-bg:#EAF2FE; --info-bd:#C5DDFB;
  /* —— 中性色（浅） —— */
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#F7F9F8; --surface-3:#EEF2F0;
  --border:#E6EBE9; --border-strong:#D6DED9;
  --text:#101E18; --text-2:#32423A; --muted:#4E5E55; --muted-2:#5E7268;
  /* —— 图表/热点 颜色 —— */
  --chart-grid:#EBEFED; --chart-axis:#9AA6A0; --chart-label:#4E5E55;
  --chart-cost:#BFD9F2; --chart-cost-zero:#F4B4B4; --chart-conv:#0A7C45; --chart-conv-zero:#C53035;
  --geo-shrink:#F4B4B4; --geo-down:#F6D98A; --geo-up:#9FE3BC; --geo-keep:#BFD9F2;
  --heat-0:#EEF1F0; --heat-1:#C6EED6; --heat-2:#5FD99A; --heat-3:#0A7C45;
  --heat-0-t:#5E7268; --heat-1-t:#0A5C33; --heat-2-t:#08351E; --heat-3-t:#FFFFFF;
  /* —— 间距（4px 基准） —— */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  /* —— 圆角 —— */
  --r-sm:8px; --r:12px; --r-lg:16px; --r-pill:999px;
  /* —— 阴影 —— */
  --sh-sm:0 1px 2px rgba(16,35,29,.05), 0 1px 3px rgba(16,35,29,.04);
  --sh:0 2px 8px rgba(16,35,29,.06), 0 1px 2px rgba(16,35,29,.04);
  --sh-md:0 8px 24px rgba(16,35,29,.10), 0 2px 6px rgba(16,35,29,.06);
  --sh-p:0 0 0 3px rgba(10,124,69,.18);
  /* —— 字体 —— */
  --font:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",Consolas,"SFMono-Regular",monospace;
  --t-fast:140ms ease; --t:220ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --p:#22C55E; --p-hover:#2AD368; --p-active:#37DA77;
  --p-50:#102217; --p-100:#16351F; --p-700:#5BE08A; --p-ink:#8AF0AD;
  --ai:#8B6DFF; --ai-hover:#9C82FF; --ai-50:#1B1733; --ai-700:#B9A6FF;
  --ok:#34D27E; --ok-bg:#0F2417; --ok-bd:#1E4A30;
  --warn:#F2AE3B; --warn-bg:#2A2110; --warn-bd:#5A4416;
  --danger:#F26469; --danger-bg:#2A1314; --danger-bd:#5A2326;
  --info:#5AA2FF; --info-bg:#0F1C30; --info-bd:#1E3A5E;
  --bg:#0E1512; --surface:#16201B; --surface-2:#1B2722; --surface-3:#212E28;
  --border:#27332C; --border-strong:#33413A;
  --text:#E6EFEA; --text-2:#C2CFC8; --muted:#8A9A91; --muted-2:#8FA097;
  --chart-grid:#22302A; --chart-axis:#5C6B62; --chart-label:#8A9A91;
  --chart-cost:#2C4A66; --chart-cost-zero:#7A2E2E; --chart-conv:#22C55E; --chart-conv-zero:#F26469;
  --geo-shrink:#7A2E2E; --geo-down:#6B531E; --geo-up:#1E4A30; --geo-keep:#2C4A66;
  --heat-0:#202C26; --heat-1:#13402A; --heat-2:#1C7A48; --heat-3:#22C55E;
  --heat-0-t:#8A9A91; --heat-1-t:#9FE3BC; --heat-2-t:#DFF7E8; --heat-3-t:#06200F;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh:0 2px 10px rgba(0,0,0,.45);
  --sh-md:0 12px 30px rgba(0,0,0,.55);
  --sh-p:0 0 0 3px rgba(34,197,94,.28);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t)}

/* ===================== 布局骨架 ===================== */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60}
.brand{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--p),#0BBF6E);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(14,164,92,.35)}
.logo svg{width:22px;height:22px}
.brand .b-name{font-size:15px;font-weight:700;line-height:1.2;letter-spacing:.2px}
.brand .b-sub{font-size:11px;color:var(--muted);margin-top:2px}

.side-scroll{flex:1;overflow-y:auto;padding:14px 12px}
.nav-label{font-size:11px;font-weight:600;color:var(--muted-2);letter-spacing:.08em;
  text-transform:uppercase;padding:6px 12px 8px}
nav#nav{display:none;flex-direction:column;gap:3px}
nav#nav.show{display:flex}
.tab{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r-sm);
  color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:500;position:relative;
  transition:background var(--t-fast),color var(--t-fast);user-select:none}
.tab .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.tab:hover{background:var(--surface-2);color:var(--text-2)}
.tab.active{background:var(--p-50);color:var(--p-700);font-weight:600}
.tab.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--p);border-radius:0 3px 3px 0}

.side-foot{padding:14px 16px;border-top:1px solid var(--border)}
.theme-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;
  font-size:13px;font-family:inherit;transition:all var(--t-fast)}
.theme-toggle:hover{border-color:var(--p);color:var(--p-700)}
.theme-toggle .ic{font-size:15px}
.side-foot .copy{font-size:10.5px;color:var(--muted-2);margin-top:10px;text-align:center;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:14px 26px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.page-title{font-size:17px;font-weight:700;line-height:1.2}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
main.content{max-width:1320px;width:100%;margin:0 auto;padding:22px 26px 80px}

/* ===================== 面板切换（核心：默认隐藏，仅激活面板显示） ===================== */
.panel{display:none}
.panel.active{display:block;animation:fadeIn var(--t)}

/* ===================== 按钮 ===================== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;
  font-size:13px;font-family:inherit;font-weight:500;transition:all var(--t-fast);white-space:nowrap}
.btn:hover{border-color:var(--p);color:var(--p-700);background:var(--surface-2)}
.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}
.btn.primary:hover{background:var(--p-hover);color:#fff;border-color:var(--p-hover)}
.btn.ai{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.ai:hover{background:var(--ai-hover);color:#fff;border-color:var(--ai-hover)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn:focus-visible{outline:none;box-shadow:var(--sh-p)}

/* ===================== 卡片 / 面板 ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh-sm);transition:box-shadow var(--t),border-color var(--t)}
.card:hover{box-shadow:var(--sh)}
.card h2{font-size:15.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;color:var(--text)}
.card h2 .ic{font-size:17px}
.card h3{font-size:13.5px;font-weight:700;margin:16px 0 9px;color:var(--text-2)}
.tag{font-size:11px;font-weight:500;color:var(--muted);background:var(--surface-2);
  padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--border)}
.section-hint{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.65}
.spacer{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;background:var(--surface-2);
  border-radius:var(--r);border:1px dashed var(--border)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1100px){.g4,.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}.g4,.g6{grid-template-columns:repeat(2,1fr)}}

/* ===================== KPI ===================== */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--sh-sm);transition:transform var(--t-fast),box-shadow var(--t)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--p-100)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:23px;font-weight:800;margin-top:3px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:11.5px;margin-top:3px;color:var(--muted)}
.up{color:var(--danger)!important}.down{color:var(--ok)!important}
/* 账户总览 KPI 行：自适应列数，尽量一排，空间不足再折行 */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi-row .kpi{padding:12px 14px}
.kpi-row .kpi .val{font-size:21px}
.kpi-row .kpi .lbl{font-size:11.5px}

/* ===================== 仪表盘（Dashboard） ===================== */
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px;position:relative;overflow:hidden;cursor:default;
  transition:transform var(--t-fast),box-shadow var(--t);box-shadow:var(--sh-sm)}
.dash-card:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.dash-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.dash-card.dc-cost::after{background:var(--p)}
.dash-card.dc-click::after{background:var(--info)}
.dash-card.dc-conv::after{background:var(--ok)}
.dash-card.dc-cpa::after{background:var(--warn)}
.dash-card.dc-ctr::after{background:var(--ai)}
.dash-card.dc-shows::after{background:var(--muted)}
.dash-card .dc-lbl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.dash-card .dc-val{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.dash-card .dc-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;min-height:18px}
.dash-card .dc-delta{font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px}
.dash-card .dc-delta.up{background:var(--danger-bg);color:var(--danger)}
.dash-card .dc-delta.down{background:var(--ok-bg);color:var(--ok)}
/* 紧凑变体（双行仪表盘） */
.dash-compact .dash-card{padding:10px 14px}
.dash-compact .dash-card .dc-val{font-size:22px;margin:2px 0}
.dash-compact .dash-card .dc-sub{font-size:11px}
/* 操作摘要卡片 */
.action-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.action-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);
  font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:all var(--t-fast)}
.action-chip:hover{border-color:var(--p);background:var(--p-50)}
.action-chip.ac-p0{border-color:var(--danger-bd);color:var(--danger)}
.action-chip.ac-p0:hover{background:var(--danger-bg)}
/* 仪表盘操作预览展开面板 */
.action-preview{display:none;margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);animation:fadeIn .18s ease}
.action-preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.action-preview .alert{margin-bottom:6px}
.action-preview .alert:last-child{margin-bottom:0}
/* 截断文本悬浮完整内容 */
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.trunc:hover{white-space:normal;overflow:visible;background:var(--surface);position:relative;z-index:5;
  box-shadow:var(--sh-md);padding:4px 8px;border-radius:6px;max-width:400px;word-break:break-all}

/* ===================== 表格 ===================== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--muted);
  font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
th:hover{color:var(--p-700)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2)}
tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.sorted-asc::after{content:" ▲";font-size:9px;color:var(--p)}
.sorted-desc::after{content:" ▼";font-size:9px;color:var(--p)}
.scroll-table{max-height:min(65vh,700px);overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);position:relative}
.scroll-table.has-more::after{content:"";position:sticky;bottom:0;left:0;right:0;height:36px;
  background:linear-gradient(transparent,var(--surface));pointer-events:none;z-index:3}
.scroll-table .load-more-row{text-align:center;padding:14px;background:var(--surface-2);border-top:1px solid var(--border);cursor:pointer;
  color:var(--p);font-weight:600;font-size:13px;transition:background var(--t-fast)}
.scroll-table .load-more-row:hover{background:var(--p-50);color:var(--p-700)}
.scroll-table .total-count{font-size:12px;color:var(--muted);text-align:center;padding:6px;border-top:1px solid var(--border);background:var(--surface-2)}

/* ===================== 徽章 / 药丸 ===================== */
.badge{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.7}
.b-red{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)}
.b-green{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-blue{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd)}
.b-amber{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-purple{background:var(--ai-50);color:var(--ai-700);border:1px solid color-mix(in srgb,var(--ai) 30%,transparent)}
.b-gray{background:var(--surface-3);color:var(--muted);border:1px solid var(--border)}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

/* ===================== 提示框 ===================== */
.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:9px;font-size:13px;display:flex;gap:9px;
  align-items:flex-start;line-height:1.6;border:1px solid transparent;flex-wrap:wrap}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.alert.warn{background:var(--warn-bg);color:#9A5B00;border-color:var(--warn-bd)}
.alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.alert.info{background:var(--info-bg);color:var(--info);border-color:var(--info-bd)}
[data-theme="dark"] .alert.warn{color:#F2C46B}

/* 关键词列表 chip（二八法则等场景） */
.kw-list{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.kw-chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);
  font-size:12px;color:var(--text-2);white-space:nowrap}

/* ===================== 导图 / 四象限 ===================== */
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.quad-grid{grid-template-columns:1fr}}
.quad{border:1px solid var(--border);border-radius:var(--r);padding:16px;background:var(--surface);
  transition:border-color var(--t),box-shadow var(--t)}
.quad:hover{border-color:var(--border-strong);box-shadow:var(--sh-sm)}
.quad h3{margin-top:0;display:flex;align-items:center;gap:8px}
.quad .action{font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;margin-top:10px;color:var(--text-2);line-height:1.6}

/* ===================== 热力图单元 ===================== */
.heatcell{display:inline-block;min-width:24px;text-align:center;border-radius:5px;padding:1px 5px;font-size:12px;font-weight:600;margin:1px}

/* ===================== AI 解读框 ===================== */
.ai-box{background:var(--ai-50);border:1px solid color-mix(in srgb,var(--ai) 22%,transparent);
  border-radius:var(--r);padding:16px 18px;margin-top:14px;font-size:13.5px;display:none;line-height:1.7}
.ai-box.show{display:block;animation:fadeIn var(--t)}
.ai-box h4{color:var(--ai-700);font-size:13px;margin-bottom:9px}
.ai-content{white-space:normal;color:var(--text-2)}
.ai-content h1,.ai-content h2,.ai-content h3{font-size:14px;margin:12px 0 6px;color:var(--text)}
.ai-content ul,.ai-content ol{margin:6px 0 6px 20px}
.ai-content p{margin:6px 0}
.ai-content strong{color:var(--ai-700)}
.ai-content code{background:color-mix(in srgb,var(--ai) 14%,transparent);padding:1px 5px;border-radius:5px;font-size:12px;font-family:var(--mono)}

/* ===================== 导入区 / 拖拽 ===================== */
.dropzone{border:2px dashed var(--border-strong);border-radius:var(--r-lg);padding:48px 24px;text-align:center;
  color:var(--muted);cursor:pointer;transition:all var(--t);background:var(--surface-2)}
.dropzone:hover,.dropzone.over{border-color:var(--p);background:var(--p-50);color:var(--p-700)}
.dropzone .big{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--text)}
.dropzone .sub{font-size:13px;color:var(--muted)}
.filelist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.fileitem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;box-shadow:var(--sh-sm)}
.fileitem .ftype{font-size:11px;padding:2px 9px;border-radius:var(--r-pill);background:var(--p-50);color:var(--p-700);font-weight:600;white-space:nowrap}
.fileitem .nm{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===================== 弹窗 ===================== */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,20,.5);z-index:100;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal-bg.show{display:flex;animation:fadeIn var(--t)}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:680px;width:100%;max-height:88vh;
  overflow-y:auto;padding:26px;box-shadow:var(--sh-md);border:1px solid var(--border)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.form-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.form-row label{width:210px;font-size:13px;color:var(--muted);flex-shrink:0;font-weight:500}
.form-row input,.form-row select{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
  font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--p);box-shadow:var(--sh-p)}
.hint{font-size:11.5px;color:var(--muted);margin:-8px 0 14px 224px;line-height:1.5}

/* ===================== 工具栏 / 图表 / 杂项 ===================== */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text],.toolbar select{padding:7px 11px;border:1px solid var(--border);border-radius:var(--r-sm);
  font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
.toolbar input[type=text]:focus,.toolbar select:focus{outline:none;border-color:var(--p)}
.chart-wrap{overflow-x:auto;padding:0}
.chart-wrap canvas{cursor:grab}
.chart-wrap canvas:active{cursor:grabbing}
.mono{font-family:var(--mono);font-size:12px}
.prio{display:inline-flex;align-items:center;justify-content:center;width:34px;height:22px;border-radius:6px;
  font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.p0{background:var(--danger)}.p1{background:var(--warn)}.p2{background:var(--info)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);
  padding:11px 22px;border-radius:var(--r-pill);font-size:13px;z-index:200;display:none;box-shadow:var(--sh-md);font-weight:500}
.covar-tip{position:fixed;z-index:300;max-width:380px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;
  box-shadow:0 8px 30px rgba(0,0,0,0.14),0 2px 8px rgba(0,0,0,0.06);
  pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
.covar-tip.show{opacity:1;transform:translateY(0)}
.covar-tip .tip-dim{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.covar-tip .tip-mean{font-size:13px;line-height:1.65;margin-bottom:8px;padding:8px 10px;border-radius:8px;background:var(--bg,#f8fafa)}
.covar-tip .tip-opt{font-size:13px;color:var(--text,#1a1a2e);margin-top:2px}
.covar-tip .tip-opt ol{margin:4px 0 0;padding-left:20px;list-style-type:decimal}
.covar-tip .tip-opt ol li{margin-bottom:4px;line-height:1.6;font-size:12.5px}
.covar-tip .tip-opt ol li:last-child{margin-bottom:0}
.covar-tip-arrow{position:absolute;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border)}
.covar-tip-arrow.top{top:-5px;transform:rotate(135deg)}
.covar-tip-arrow.bottom{bottom:-5px;transform:rotate(-45deg)}

/* ===================== 全局帮���提示系统 ===================== */
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--border-strong);background:transparent;color:var(--muted);cursor:help;
  font-size:12px;font-weight:700;font-family:inherit;line-height:1;flex-shrink:0;
  transition:all var(--t-fast);position:relative;user-select:none;margin-left:2px;padding:0;
  outline:none}
.help-btn:hover,.help-btn:focus{background:var(--p-50);border-color:var(--p);color:var(--p-700)}
.help-btn:focus-visible{box-shadow:var(--sh-p)}
.help-tooltip{position:fixed;z-index:400;max-width:420px;background:var(--surface);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:18px 20px;font-size:13px;
  line-height:1.75;box-shadow:0 12px 40px rgba(0,0,0,0.16),0 3px 12px rgba(0,0,0,0.06);
  pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease;
  overflow-y:auto;max-height:80vh}
.help-tooltip.show{opacity:1;transform:translateY(0);pointer-events:auto}
.help-tooltip h3{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--p-700);display:flex;align-items:center;gap:6px}
.help-tooltip h3 .ic{font-size:16px}
.help-tooltip .ht-section{margin-bottom:12px}
.help-tooltip .ht-section:last-child{margin-bottom:0}
.help-tooltip .ht-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted-2);margin-bottom:3px}
.help-tooltip .ht-text{font-size:13px;color:var(--text-2);line-height:1.65}
.help-tooltip .ht-actions{margin-top:10px;padding:10px 12px;background:var(--p-50);border-radius:var(--r-sm);
  border-left:3px solid var(--p);font-size:12.5px;color:var(--p-ink);line-height:1.65}
.help-tooltip .ht-actions b{display:block;margin-bottom:4px;font-size:13px}
.help-tooltip .ht-actions ol{margin:4px 0 0;padding-left:18px}
.help-tooltip .ht-actions ol li{margin-bottom:4px}
.help-tooltip .ht-actions ol li:last-child{margin-bottom:0}
.help-tooltip .ht-arrow{position:absolute;width:10px;height:10px;background:var(--surface);
  border-left:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}
.help-tooltip .ht-arrow.top{top:-5px;transform:rotate(135deg)}
.help-tooltip .ht-arrow.bottom{bottom:-5px;transform:rotate(-45deg)}

/* ===================== 数据感知浮层提示系统 ===================== */
.data-tooltip{position:fixed;z-index:390;max-width:400px;background:var(--surface);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:12px 16px;font-size:12.5px;
  line-height:1.5;box-shadow:0 12px 40px rgba(0,0,0,0.16),0 3px 12px rgba(0,0,0,0.06);
  pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;
  overflow-y:auto;max-height:540px}
.data-tooltip.show{opacity:1;transform:translateY(0);pointer-events:auto}
.data-tooltip .dt-dim{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.data-tooltip .dt-eval{font-size:12.5px;font-weight:600;margin-bottom:6px;padding:6px 8px;border-radius:7px;line-height:1.45}
.data-tooltip .dt-eval.b-green-bg{background:var(--ok-bg);color:var(--ok)}
.data-tooltip .dt-eval.b-red-bg{background:var(--danger-bg);color:var(--danger)}
.data-tooltip .dt-eval.b-amber-bg{background:var(--warn-bg);color:var(--warn)}
.data-tooltip .dt-eval.b-blue-bg{background:var(--info-bg);color:var(--info)}
.data-tooltip .dt-eval.b-gray-bg{background:var(--surface-2);color:var(--muted)}
.data-tooltip .dt-what{font-size:12px;color:var(--muted);margin-bottom:4px;line-height:1.45}
.data-tooltip .dt-opt{margin-top:2px;padding:6px 8px;background:var(--p-50);border-radius:7px;border-left:3px solid var(--p)}
.data-tooltip .dt-opt b{font-size:12px;color:var(--p-ink)}
.data-tooltip .dt-opt ol{margin:3px 0 0;padding-left:16px;font-size:11.5px;color:var(--text-2)}
.data-tooltip .dt-opt ol li{margin-bottom:2px;line-height:1.45}
.data-tooltip .dt-opt ol li:last-child{margin-bottom:0}
.data-tooltip .dt-stat{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.45}

footer.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px;line-height:1.7}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== 图表点击弹窗（Chart Click Popup） ===================== */
.chart-popup-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.chart-popup-overlay.show{opacity:1;pointer-events:auto}
.chart-popup{position:relative;width:min(720px,94vw);max-height:min(85vh,720px);
  background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,0.25),0 4px 16px rgba(0,0,0,0.08);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(12px) scale(0.97);transition:transform .22s ease}
.chart-popup-overlay.show .chart-popup{transform:translateY(0) scale(1)}
.chart-popup-header{display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface-2)}
.chart-popup-header .cp-title{font-size:16px;font-weight:700;color:var(--text);flex:1}
.chart-popup-header .cp-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.chart-popup-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:18px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:all var(--t-fast)}
.chart-popup-close:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.chart-popup-body{flex:1;overflow-y:auto;padding:18px 20px 24px;font-size:13px;line-height:1.65;color:var(--text-2)}
.cp-section{margin-bottom:16px}
.cp-section:last-child{margin-bottom:0}
.cp-section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:1px dashed var(--border)}
.cp-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.cp-kpi{padding:12px 14px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--border)}
.cp-kpi .cp-k-lbl{font-size:11px;color:var(--muted);margin-bottom:3px}
.cp-kpi .cp-k-val{font-size:20px;font-weight:800;color:var(--text);line-height:1.2}
.cp-kpi .cp-k-delta{font-size:11px;margin-top:3px}
.cp-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);max-height:320px;overflow-y:auto}
.cp-table-wrap table{width:100%;border-collapse:collapse;font-size:12px}
.cp-table-wrap th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-size:11px;font-weight:700;
  color:var(--muted);text-align:left;padding:7px 10px;border-bottom:2px solid var(--border)}
.cp-table-wrap td{padding:7px 10px;border-bottom:1px solid var(--border-weak);white-space:nowrap}
.cp-table-wrap tr:last-child td{border-bottom:none}
.cp-analysis{padding:12px 14px;background:var(--p-50);border-radius:var(--r);border-left:3px solid var(--p);
  font-size:12.5px;line-height:1.65;color:var(--p-ink)}
.cp-analysis b{color:var(--p-700)}
.cp-analysis ol,.cp-analysis ul{margin:6px 0 0;padding-left:18px}
.cp-analysis li{margin-bottom:3px}
.cp-analysis li:last-child{margin-bottom:0}
.cp-mini-chart{display:flex;align-items:flex-end;gap:2px;height:60px;padding:4px 0;margin:8px 0}
.cp-mini-chart .mc-bar{flex:1;min-width:3px;border-radius:2px 2px 0 0;transition:height .2s}
/* 点击提示光标 */
.clickable{cursor:pointer;transition:opacity .15s,box-shadow .15s}
.clickable:hover{opacity:.88;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
/* print: hide popup */
@media print{.chart-popup-overlay{display:none!important}}

/* ===================== 响应式 ===================== */
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;
    border-right:none;border-bottom:1px solid var(--border);overflow-x:auto}
  .brand{border-bottom:none;border-right:1px solid var(--border);white-space:nowrap}
  .side-scroll{display:flex;align-items:center;padding:8px;flex:1}
  .nav-label{display:none}
  nav#nav{flex-direction:row;display:none}
  nav#nav.show{display:flex}
  .tab{white-space:nowrap}
  .tab .txt{display:none}
  .side-foot{display:none}
  main.content{padding:18px 16px 60px}
}
/* ---------- ⓪ 数据覆盖 / 工作流 / 转化链路漏斗 ---------- */
.funnel{margin:8px 0 4px;border:1px solid var(--border, #e5e7eb);border-radius:14px;overflow:hidden}
.funnel-stage{padding:12px 16px;border-bottom:1px solid var(--border, #e5e7eb);background:linear-gradient(90deg, rgba(37,99,235,0.04), transparent)}
.funnel-stage:last-child{border-bottom:none}
.fs-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fs-name{font-weight:700;font-size:15px;color:var(--text, #1f2937)}
.fs-desc{color:var(--muted, #6b7280);font-size:12.5px}
.fs-cov{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fs-miss{color:var(--danger, #dc2626);font-size:12px;opacity:.8}
.wf-cat{margin-top:12px}
.wf-cat-h{font-weight:700;color:var(--text, #1f2937);font-size:14px;margin-bottom:6px;padding-left:8px;border-left:3px solid var(--p, #0A7C45)}
.wf-mod{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;flex-wrap:wrap}
.wf-mod:nth-child(even){background:rgba(0,0,0,0.02)}
.wf-mod-name{font-weight:600;font-size:13.5px}
.wf-mod-need{color:var(--muted, #6b7280);font-size:12px}
[data-theme="dark"] .funnel-stage{background:linear-gradient(90deg, rgba(96,165,250,0.06), transparent)} [data-theme="dark"] .wf-mod:nth-child(even){background:rgba(255,255,255,0.03)}

/* ---------- 离线 / DeepSeek 模式切换开关 ---------- */
.seg{display:inline-flex;align-items:center;border:1px solid var(--border, #e5e7eb);border-radius:9px;overflow:hidden;background:var(--surface, #fff)}
.seg-btn{appearance:none;border:none;background:transparent;color:var(--muted, #6b7280);font-size:12.5px;padding:6px 11px;cursor:pointer;transition:.18s;white-space:nowrap}
.seg-btn:hover{color:var(--text, #1f2937)}
.seg-btn.active{background:var(--p, #0A7C45);color:#fff;font-weight:600}
.seg-btn + .seg-btn{border-left:1px solid var(--border, #e5e7eb)}
[data-theme="dark"] .seg{background:rgba(255,255,255,0.04)} [data-theme="dark"] .seg-btn{color:#9ca3af} [data-theme="dark"] .seg-btn:hover{color:#e5e7eb}

/* ===================== PDF 报告打印样式 ===================== */
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .sidebar,.topbar,.foot,.btn,.modal-bg,.help-btn,.help-tooltip,.data-tooltip,.covar-tip,.toast{display:none!important}
  .app{display:block}.main{display:block}
  main.content{max-width:100%;padding:0}
  .panel{display:block!important;page-break-before:always}
  .panel:first-of-type{page-break-before:avoid}
  .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid;margin-bottom:14px;padding:12px 16px}
  .card h2{font-size:15pt;color:#000;border-bottom:2px solid #2563eb;padding-bottom:6px}
  .scroll-table{max-height:none;overflow:visible;border:1px solid #ccc}
  table{font-size:10pt}th,td{padding:4px 7px;border:1px solid #ddd}
  th{background:#f5f5f5;color:#000}
  .badge{border:1px solid #999;color:#000;background:#f0f0f0}
  .b-red{color:#c00;background:#fff0f0}.b-green{color:#060;background:#f0fff0}
  .b-amber{color:#960;background:#fff8f0}.b-blue{color:#006;background:#f0f0ff}
  .p0{background:#dc2626!important;-webkit-print-color-adjust:exact;color-adjust:exact}
  .p1{background:#d97706!important;-webkit-print-color-adjust:exact;color-adjust:exact}
  .p2{background:#2563eb!important;-webkit-print-color-adjust:exact;color-adjust:exact}
  .kpi{box-shadow:none;border:1px solid #e0e0e0;padding:10px 14px}
  .kpi .val{font-size:18pt}
  .dashboard{page-break-inside:avoid}
  .dash-card{border:1px solid #e0e0e0;box-shadow:none;padding:10px 14px}
  .dash-card .dc-val{font-size:20pt}
  .empty{background:#f9f9f9;border-style:dashed}
  canvas{max-width:100%!important;height:auto!important}
  .ai-box{background:#f5f5ff;border:1px solid #d0d0ff}
  .ai-box h4{color:#4b2fd6}
}
